name: Repair page JSX

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed GradingView JSX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()
          old = "{!p.disciplines.length&&<div className=\"empty\">No grading modules configured.</div></div></>;"
          new = "{!p.disciplines.length&&<div className=\"empty\">No grading modules configured.</div></>;"
          if old not in s:
              print('No malformed GradingView JSX found; nothing to repair.')
              raise SystemExit(0)
          p.write_text(s.replace(old, new, 1))
          print('Repaired GradingView JSX.')
          PY
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- src/app/page.tsx; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "Fix GradingView JSX closing tag"
          git push