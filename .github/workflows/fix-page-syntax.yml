name: Repair page JSX

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed GradingView JSX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()
          original = s

          # Fix the complete early-return statement. The source previously
          # had </>; but was missing the closing } for if(!p.selected){...}.
          s = s.replace(
              'No grading modules configured.</div></>;',
              'No grading modules configured.</div></>;}',
              1,
          )

          # Keep this idempotent in case a later push already contains it.
          if s == original:
              print('No GradingView repair needed.')
          else:
              p.write_text(s)
              print('Repaired missing GradingView closing brace.')
          PY
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- src/app/page.tsx; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "Fix missing GradingView closing brace"
          git push
