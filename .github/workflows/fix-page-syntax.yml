name: Repair page JSX

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed GradingView JSX
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/page.tsx')
          s = p.read_text()
          original = s

          # The early-return fragment was valid-looking JSX but left the
          # following const statement outside a function block. Make the
          # early return an explicit block so SWC parses the function safely.
          s = s.replace('if(!p.selected)return <>', 'if(!p.selected){return <>', 1)

          # Remove the stale extra closing div from the no-selection branch.
          s = s.replace(
              'No grading modules configured.</div></div></>;',
              'No grading modules configured.</div></>;',
              1,
          )

          if s == original:
              print('No GradingView repair needed.')
          else:
              p.write_text(s)
              print('Repaired GradingView JSX.')
          PY
      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet -- src/app/page.tsx; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx
          git commit -m "Fix GradingView JSX parsing"
          git push
